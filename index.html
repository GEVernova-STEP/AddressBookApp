<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <h1>📒 Address Book</h1>
        <button id="addBtn" class="btn btn-primary">+ Add Contact</button>
    </header>

    <!-- Search & Filter Section -->
    <section class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search by name, email, or phone...">
            <select id="sortSelect">
                <option value="">Sort By</option>
                <option value="firstName">First Name</option>
                <option value="lastName">Last Name</option>
                <option value="email">Email</option>
            </select>
            <button id="resetBtn" class="btn">Reset</button>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-item">
                <span id="totalCount">0</span>
                <p>Total Contacts</p>
            </div>
            <div class="stat-item">
                <span id="displayCount">0</span>
                <p>Showing</p>
            </div>
        </div>
    </section>

    <!-- Contacts List -->
    <section class="container">
        <div id="contactsList"></div>
        <div id="noContacts" class="message" style="display: none;">
            No contacts found. Click "Add Contact" to get started!
        </div>
    </section>

    <!-- Add/Edit Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Contact</h2>
                <span class="close">&times;</span>
            </div>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="firstName" required>
                    <span class="error" id="firstNameError"></span>
                </div>

                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="lastName" required>
                    <span class="error" id="lastNameError"></span>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" required>
                    <span class="error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label>Phone *</label>
                    <input type="tel" id="phone" required>
                    <span class="error" id="phoneError"></span>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address">
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="city">
                </div>

                <div class="form-actions">
                    <button type="button" id="cancelBtn" class="btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content modal-small">
            <h2>Delete Contact?</h2>
            <p>Are you sure you want to delete <strong id="deleteName"></strong>?</p>
            <div class="form-actions">
                <button id="cancelDeleteBtn" class="btn">Cancel</button>
                <button id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <script src="js/script.js"></script>
</body>
</html>
